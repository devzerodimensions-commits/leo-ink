# Render blueprint — https://render.com/docs/blueprint-spec
#
#   leo-ink-web  the React build, served as a CDN-backed static site — MANAGED HERE
#   leo-ink-api  Express API, runs `prisma migrate deploy` on every boot
#
# NOTE ON THE API: Render skips creating a service whose `sync: false` env var has
# no value yet, and a Manual sync never prompts for one (only the very first
# blueprint deploy does). Since DATABASE_URL has to be supplied by hand anyway,
# create the API as a normal Web Service in the dashboard with these settings:
#
#   Name           leo-ink-api
#   Region         Singapore          Branch  main       Root directory  (blank)
#   Runtime        Node
#   Build command  npm ci --include=dev && npm run build --workspace server
#   Start command  npm run start --workspace server
#   Health check   /api/health
#
# `--include=dev` is REQUIRED, not tidiness. Render exposes NODE_ENV=production
# during the build, and npm then omits devDependencies — which is where
# typescript, the prisma CLI and @types/node live. Without it `tsc` dies with
# TS2688 "cannot find type definition file for 'node'" and the build exits 2.
# (leo-ink-web builds fine because it sets no NODE_ENV.)
#   Env            DATABASE_URL, JWT_SECRET, CORS_ORIGIN, NODE_ENV, TRIAL_DAYS
#                  (values described below)
#
# The `services:` entry for it is kept here as the source of truth for those
# settings, commented out so the blueprint does not try to create it.
#
# This repo is an npm workspace, so both services build from the REPO ROOT
# (`npm ci` once, then `--workspace <name>`). Setting rootDir per service would
# install each package in isolation and break the shared lockfile.
#
# THE DATABASE IS NOT CREATED HERE. Render permits only one free PostgreSQL per
# account, so a `databases:` block fails the whole sync if you already have one.
# Instead DATABASE_URL is marked `sync: false` and you paste it once at deploy
# time — which works whichever way you get a database:
#
#   Reusing a Postgres you already have (free, nothing to delete):
#     take its Internal Database URL and append a dedicated schema —
#     postgresql://…/dbname?schema=leoink
#     Leo Ink's 35 tables land in the `leoink` schema; anything already in
#     `public` is untouched. Verified, not assumed.
#
#   Giving Leo Ink its own database:
#     create it in Render (New → PostgreSQL, region Singapore for India), then
#     paste its Internal Database URL as-is.
#
# Either way `prisma migrate deploy` creates the schema and tables on first boot.

# ── API — created by hand; kept here as the record of its settings ───────────
#  - type: web
#    name: leo-ink-api
#    runtime: node
#    plan: free            # spins down after 15 min idle; next request takes ~50 s
#    region: singapore
#    buildCommand: npm ci --include=dev && npm run build --workspace server
#    startCommand: npm run start --workspace server
#    healthCheckPath: /api/health
#    envVars:
#      - key: NODE_ENV
#        value: production
#      - key: DATABASE_URL
#        sync: false       # your Postgres URL, + ?schema=leoink if it is shared
#      - key: JWT_SECRET
#        generateValue: true
#      - key: TRIAL_DAYS
#        value: "14"
#      - key: CORS_ORIGIN
#        value: https://leo-ink-web.onrender.com   # the web app's full origin

services:
  # ── Web ────────────────────────────────────────────────────────────────────
  - type: web
    name: leo-ink-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace web
    staticPublishPath: web/dist
    envVars:
      # Set explicitly rather than via `fromService`, because the API is created
      # by hand (see the note at the top) and a blueprint cannot reference a
      # service it does not manage. The client appends /api itself.
      # If the API ends up on a different hostname, change it here — the blueprint
      # re-syncs on every push and would overwrite a dashboard edit.
      - key: VITE_API_URL
        value: https://leo-ink-api.onrender.com
    routes:
      # Single-page app: unknown paths fall through to index.html, otherwise a
      # refresh on /quotes/:id would 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
