services:
  db:
    image: postgres:16-alpine
    container_name: leoink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leoink
      POSTGRES_PASSWORD: leoink
      POSTGRES_DB: leoink
    ports:
      - "5433:5432"
    volumes:
      - leoink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoink -d leoink"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  leoink-pgdata:
